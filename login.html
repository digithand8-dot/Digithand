<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScanMark Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6b9 0%, #fae3d9 25%, #bbded6 50%, #8ac6d1 75%, #ffb6b9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        main {
            background: white;
            padding: 40px;
            width: 340px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 2em;
        }
        p.subtitle {
            color: gray;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        label {
            text-align: left;
            margin-bottom: 5px;
            font-size: 14px;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            background: #2c7be5;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1a5fc1;
        }
        .signin-btn {
            background: #ffb6b9;
            color: #2c3e50;
        }
        .signin-btn:hover {
            background: #fae3d9;
        }
        footer {
            margin-top: 15px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>
    <main>
        <h1>ScanMark</h1>
        <p class="subtitle">Automated Marks Recognition System</p>
        <form id="loginForm" autocomplete="on" aria-label="Login Form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter your username" required autofocus>
            
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required>
            
            <div class="button-group">
                <button type="submit">Login</button>
                <button type="button" class="signin-btn" onclick="window.location.href='signup.html'">Sign Up</button>
            </div>
        </form>
        <div id="message"></div>
        <footer>
            © 2026 ScanMark System
        </footer>
    </main>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');

    fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, password })
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            messageDiv.innerHTML = '<p style="color: green;">' + data.message + '</p>';
            setTimeout(() => window.location.href = 'dashboard.html', 2000);
        } else {
            messageDiv.innerHTML = '<p style="color: red;">' + data.error + '</p>';
        }
    })
    .catch(error => {
        messageDiv.innerHTML = '<p style="color: red;">An error occurred. Please try again.</p>';
    });
});
</script>

</body>
</html>
